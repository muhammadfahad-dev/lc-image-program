<!doctype html>
<!-- A stand-in for gemini.google.com used by tests/test_web.py. It copies only the controls the program uses. -->
<meta charset="utf-8"><title>Mock Gemini</title>
<body>
<main id="chat"></main>
<div id="composer">
  <div id="previews"></div>
  <button aria-label="Open upload file menu" id="plus">+</button>
  <div role="menu" id="menu" hidden><button role="menuitem" id="upload">Upload files</button></div>
  <input type="file" id="file" hidden multiple>
  <rich-textarea><div class="ql-editor" contenteditable="true" role="textbox" aria-label="Enter a prompt"></div></rich-textarea>
  <button aria-label="Send message" id="send">Send</button>
</div>
<script>
const mode = new URLSearchParams(location.search).get('mode') || localStorage.getItem('mode') || 'ok';
const $ = (s) => document.querySelector(s);
let attached = 0;
// slowmenu: the menu opens late; nomenu: no upload button or file field, only drag-and-drop works
$('#plus').onclick = () => { setTimeout(() => { $('#menu').hidden = false; }, mode === 'slowmenu' ? 1500 : 0); };
if (mode === 'nomenu') { $('#plus').remove(); $('#file').remove(); }
// Attachments add up like on the real site; nopreview: the photo attaches but shows no recognisable preview
const showPreviews = () => { if (mode !== 'nopreview') $('#previews').innerHTML = '<uploader-file-preview>photo</uploader-file-preview>'.repeat(attached); };
$('.ql-editor').addEventListener('drop', (e) => { e.preventDefault(); attached += e.dataTransfer.files.length; showPreviews(); });
$('#upload').onclick = () => { $('#menu').hidden = true; $('#file').click(); };
if ($('#file')) $('#file').onchange = () => { attached += $('#file').files.length; setTimeout(showPreviews, 500); };
$('#send').onclick = () => {
  const prompt = $('.ql-editor').innerText;
  window.lastPrompt = prompt; window.lastAttached = attached;
  const r = document.createElement('model-response');
  r.innerHTML = '<message-content></message-content>';
  $('#chat').append(r);
  const stop = document.createElement('button'); stop.setAttribute('aria-label', 'Stop response'); stop.textContent = 'Stop';
  setTimeout(() => $('#composer').append(stop), 300);
  setTimeout(() => {
    stop.remove();
    if (prompt.includes('Reply with only the JSON object')) { r.querySelector('message-content').textContent = '```json\n{"pass": true, "problems": []}\n```'; return; }
    if (mode === 'limit') { r.querySelector('message-content').textContent = "You've reached your limit for image generation. Try again tomorrow."; return; }
    if (mode === 'refuse') { r.querySelector('message-content').textContent = "I can't help with that."; return; }
    const w = mode === 'square' ? 1024 : 1024, h = mode === 'square' ? 1024 : 1280;
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const x = c.getContext('2d'); x.fillStyle = '#6D7464'; x.fillRect(0, 0, w, h);
    c.toBlob((blob) => {
      const url = URL.createObjectURL(blob);
      // multi: Gemini answers with two images; the second one is charcoal so a wrong pick is visible
      const second = mode === 'multi' ? (() => { x.fillStyle = '#25231F'; x.fillRect(0, 0, w, h); return c.toDataURL('image/png'); })() : null;
      r.innerHTML = `<generated-image><img src="${url}"><button aria-label="Download full size image">Download</button></generated-image>`
        + (second ? `<generated-image><img src="${second}"><button aria-label="Download full size image">Download</button></generated-image>` : '');
      r.querySelectorAll('button').forEach((b, i) => { b.onclick = () => { const a = document.createElement('a'); a.href = i ? second : url; a.download = 'Gemini_Generated_Image.png'; a.click(); }; });
    }, 'image/png');
  }, 3000);
};
</script>
