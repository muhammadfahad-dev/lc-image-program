name: LC images

on:
  # Daily run, shortly after Gemini's free daily limit resets (midnight US Pacific time).
  # It only does live work once the repository variable LIVE is set to "true" (after the pilot is approved).
  schedule:
    - cron: "20 8 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "test-key = check the Gemini key · pilot = make images for review, change nothing · live = update the store"
        type: choice
        options: [test-key, pilot, live]
        default: pilot
      handles:
        description: "Product handles, comma-separated (leave empty to go through the store)"
        required: false
        default: ""
      limit:
        description: "Most products to work on in this run"
        required: false
        default: "5"

permissions:
  contents: write

concurrency:
  group: lc-images
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    if: github.event_name == 'workflow_dispatch' || vars.LIVE == 'true'
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
      SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
      SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
      SHOPIFY_STORE: ${{ vars.SHOPIFY_STORE || '0anyrv-ej.myshopify.com' }}
      MAX_PRODUCTS: ${{ vars.MAX_PRODUCTS || '25' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python tests/test_pipeline.py && python tests/test_gemini.py
      - name: Run
        run: |
          set -o pipefail
          mkdir -p output
          MODE="${{ github.event.inputs.mode || 'live' }}"
          echo "$MODE" > output/mode.txt
          case "$MODE" in
            test-key) python run.py --test-key 2>&1 | tee output/run.log ;;
            pilot)    python run.py --dry-run --limit "${{ github.event.inputs.limit || '5' }}" --handles "${{ github.event.inputs.handles }}" 2>&1 | tee output/run.log ;;
            live)     python run.py --limit "${{ github.event.inputs.limit || env.MAX_PRODUCTS }}" --handles "${{ github.event.inputs.handles }}" 2>&1 | tee output/run.log ;;
          esac
      - name: Show the error
        if: failure()
        run: tail -n 12 output/run.log 2>/dev/null | sed 's/%/%25/g' | while IFS= read -r line; do echo "::error::$line"; done
      - name: Save the report to the reports branch
        if: always()
        run: |
          RUN="runs/${{ github.run_number }}"
          mkdir -p "/tmp/report/$RUN"
          cp output/run.log output/summary.json output/mode.txt "/tmp/report/$RUN/" 2>/dev/null || true
          # Images are kept only for pilots (for review); live runs keep the log and summary
          if [ "$(cat output/mode.txt 2>/dev/null)" = "pilot" ]; then cp -r output/. "/tmp/report/$RUN/"; fi
          git config user.name "lc-images-bot"
          git config user.email "lc-images-bot@users.noreply.github.com"
          if git fetch --depth 1 origin reports 2>/dev/null; then git checkout -q -B reports origin/reports; else git checkout -q --orphan reports; git rm -rq --cached . 2>/dev/null || true; find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +; fi
          mkdir -p runs && cp -r "/tmp/report/runs/." runs/
          git add runs
          git commit -q -m "Report for run ${{ github.run_number }}" && git push -q origin reports || echo "Nothing to save"
